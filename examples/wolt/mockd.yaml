# ── Static mocks ───────────────────────────────────────────────────────────────
mocks:
  # Authentication 2.0 — authorization-code flow with single-use refresh tokens.
  #   GET  /oauth2/authorize?client_id=..&redirect_uri=..&response_type=code&state=..
  #        (stands in for Wolt's merchant onboarding; auto-approves the venue owner)
  #   POST /oauth2/token  (HTTP Basic client auth; grant_type=authorization_code|refresh_token)
  - id: wolt-auth
    name: Wolt integrations-authentication-service
    type: oauth
    enabled: true
    oauth:
      issuer: http://localhost:4280/oauth2
      tokenExpiry: "1h"        # Wolt: access tokens live one hour
      refreshExpiry: "30d"     # Wolt: refresh tokens live 30 days ...
      rotateRefreshTokens: true # ... and are single-use
      defaultScopes: [offline]
      clients:
        - clientId: wolt-pilot-client
          clientSecret: wolt-pilot-secret
          redirectUris:
            - http://localhost:3000/wolt/oauth/callback
            - http://localhost:8080/wolt/oauth/callback
            - https://oauth.pstmn.io/v1/callback
          grantTypes: [authorization_code, refresh_token]
      users:
        - username: venue-owner
          password: venue-owner
          claims:
            sub: "68656c6c6f76326f72646572"
            name: "Wolt's Cafe owner"

  # Menu export download. GET /v2/venues/{venueId}/menu answers 202 with a
  # resource_url pointing here (Wolt hands out a pre-signed S3 URL).
  - id: wolt-menu-export-download
    name: Menu export resource_url (stands in for S3)
    type: http
    http:
      matcher: { method: GET, path: "/_mock/s3/menu-exports/{requestId}" }
      statefulBinding: { table: menu_exports, action: get }

  # Wolt Drive cancellation. Not part of the captured API reference; path taken
  # from the Wolt Drive endpoints guide (developer.wolt.com/docs/wolt-drive/endpoints).
  - id: wolt-drive-cancel
    name: Cancel a Wolt Drive delivery (before courier acceptance)
    type: http
    http:
      matcher: { method: PATCH, path: "/order/{woltOrderReferenceId}/status/cancel" }
      statefulBinding: { table: deliveries, action: custom, operation: CancelDelivery }

  # Negative-auth fixture: any call presenting this token gets 401.
  - id: wolt-expired-token
    name: Expired bearer token
    type: http
    http:
      priority: 100
      matcher:
        pathPattern: "^/(orders|v2|v1|venues|merchants|order)/.*"
        headers: { Authorization: "Bearer expired-token" }
      response:
        statusCode: 401
        headers: { Content-Type: application/json }
        body: '{"detail":"Unauthorized"}'

# ── Contracts from Wolt's API reference ────────────────────────────────────────
imports:
  - { path: specs/order.openapi.json, as: order }
  - { path: specs/menu.openapi.json, as: menu }
  - { path: specs/venue.openapi.json, as: venue }
  - { path: specs/timeslot.openapi.json, as: timeslot }
  - { path: specs/drive.openapi.json, as: drive }

# ── State ──────────────────────────────────────────────────────────────────────
tables:
  # Same order, two representations: GET /orders/{id} (v1) and GET /v2/orders/{id}.
  # Every lifecycle operation updates both.
  - name: orders_v2
    idField: id
    response: *read
    seedData:
      - { <<: *order-v2, id: "6710a1000000000000000001", order_number: "101", delivery: *delivery-wolt }
      - { <<: *order-v2, id: "6710a1000000000000000002", order_number: "102", delivery: *delivery-takeaway }
      - { <<: *order-v2, id: "6710a1000000000000000003", order_number: "103", delivery: *delivery-wolt, type: preorder, pre_order: *preorder }
      - { <<: *order-v2, id: "6710a1000000000000000004", order_number: "104", delivery: *delivery-self }
      - { <<: *order-v2, id: "6710a1000000000000000005", order_number: "105", delivery: *delivery-done, order_status: delivered, created_at: "2026-10-18T18:00:00.000Z", modified_at: "2026-10-18T18:42:10.000Z" }
  - name: orders
    idField: id
    response: *read
    seedData:
      - { <<: *order-v1, id: "6710a1000000000000000001", order_number: "101", delivery: *delivery-wolt }
      - { <<: *order-v1, id: "6710a1000000000000000002", order_number: "102", delivery: *delivery-takeaway }
      - { <<: *order-v1, id: "6710a1000000000000000003", order_number: "103", delivery: *delivery-wolt, type: preorder, pre_order: *preorder }
      - { <<: *order-v1, id: "6710a1000000000000000004", order_number: "104", delivery: *delivery-self }
      - { <<: *order-v1, id: "6710a1000000000000000005", order_number: "105", delivery: *delivery-done, order_status: delivered, created_at: "2026-10-18T18:00:00.000Z", modified_at: "2026-10-18T18:42:10.000Z" }

  # Append-only log of partner actions; sim/wolt_sim.py turns these into webhooks.
  - name: order_events
    idField: id
    idStrategy: sequence

  # Venue API state. Fields starting with "_" are internal and never returned.
  - name: venues
    idField: id
    response:
      timestamps: { format: none }
      errors: *marketplace-errors
      fields: { hide: [id, _delivery_provider, _offline_until, _special_opening_times] }
    seedData:
      - id: "68656c6c6f76326f72646572"
        external_venue_id: wolt_external_store
        status: { is_open: true, is_online: true, is_ipad_free: true }
        contact_details: { address: "Pohjoinen Rautatiekatu 21", phone: "+3581234567" }
        opening_times:
          - { opening_day: MONDAY, opening_time: "00:00", closing_day: SUNDAY, closing_time: "24:00" }
        special_times: []
        delivery_area:
          - { lat: 60.17734425244339, lng: 24.917020270161032 }
          - { lat: 60.18649367021024, lng: 24.954304719812797 }
          - { lat: 60.171082655559786, lng: 24.982873324091287 }
          - { lat: 60.15349563690458, lng: 24.932272999563537 }
          - { lat: 60.17734425244339, lng: 24.917020270161032 }
        venue_config:
          order_api_enabled: true
          menu_api_enabled: true
          prep_time_duration: 600
          max_acceptance_prep_time_duration: null
          rate_limit_settings:
            itemsUpdate: { refresh_rate_in_minutes: 1, limit: 120 }
            getMenu: { refresh_rate_in_minutes: 1, limit: 999 }
        last_three_orders_status: [DELIVERED]
        order_handling_configuration: { acceptance_by_wolt: false, using_courier_arrival_notification: true }
        _delivery_provider: WOLT
        _offline_until: null
        _special_opening_times: null
  - name: venue_events
    idField: id
    idStrategy: sequence

  # Menu API state: the last menu pushed per venue, and async export requests.
  - name: menus
    idField: id
    response: *read
    seedData:
      - id: "68656c6c6f76326f72646572"
        menu:
          id: "wolt-pilot-menu"
          currency: EUR
          primary_language: en
          categories:
            - id: burgers
              name: [{ lang: en, value: Burgers }]
              items:
                - external_data: { external_id: SUPERHAMBURG }
                  name: [{ lang: en, value: Super Hamburger }]
                  price: 2290
                  vat_percentage: 14
                  enabled: true
            - id: drinks
              name: [{ lang: en, value: Drinks }]
              items:
                - external_data: { external_id: "123" }
