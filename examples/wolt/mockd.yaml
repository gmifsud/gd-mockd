# Wolt digital twin for mockd
# ===========================
#
# Mocks Wolt's partner integration surface on one port (default 4280):
#
#   Authentication 2.0   /oauth2/token, /oauth2/authorize          (mockd OAuth provider)
#   Order API (v1 + v2)  /orders/{orderId}/..., /v2/orders/{orderId} (stateful, enforced lifecycle)
#   Menu API             /v1/restaurants/{venueId}/menu, /v2/venues/{venueId}/menu, /venues/{venueId}/items...
#   Venue API            /venues/{venueId}/status|settings|online|opening-times|...
#   Time slot API        /v1/venues/{venueId}/time-slots          (contract only)
#   Wolt Drive API       /v1/venues/{venueId}/shipment-promises, /v1/venues/{venueId}/deliveries, /merchants/...
#
# Wolt -> partner traffic (order webhooks, Order Submitter pushes, venue
# alerts, Drive JWT webhooks) is produced by sim/wolt_sim.py, which follows the
# `order_events`, `venue_events` and `drive_events` tables written here.
#
# Contracts come from specs/*.openapi.json, generated from Wolt's published
# reference pages (see tools/build_specs.py). Every endpoint not bound below is
# still served from those specs with Wolt's own example payloads.
#
# Start:  mockd start -c examples/wolt/mockd.yaml --no-auth
# Reset:  curl -X POST http://localhost:4290/state/reset
#
# Keys starting with x- are ignored by mockd and only host YAML anchors.

version: "1.0"

# ── Shared response transforms ─────────────────────────────────────────────────
# Wolt does not document an error body for the marketplace APIs (only status
# codes), so the twin answers {"detail": "<reason>"}, the shape Wolt Drive uses
# for 401/422. Drive endpoints use Drive's documented {error_code, reason}.
x-marketplace-errors: &marketplace-errors
  fields: { message: detail }

x-read: &read
  timestamps: { format: none }
  errors: *marketplace-errors

x-accepted: &accepted            # 202 Accepted, empty body
  timestamps: { format: none }
  errors: *marketplace-errors
  custom: { status: 202, noBody: true }

x-no-content: &no-content        # 204 No Content
  timestamps: { format: none }
  errors: *marketplace-errors
  custom: { status: 204 }

x-ok-json: &ok-json              # 200 with the operation's response
  timestamps: { format: none }
  errors: *marketplace-errors
  fields: { hide: [id] }         # custom operations carry a placeholder id

x-drive-errors: &drive-errors
  fields: { message: error_code }
  inject: { reason: "See error_code (mocked by mockd)", details: null }

x-drive-created: &drive-created
  timestamps: { format: none }
  errors: *drive-errors
  custom: { status: 201 }

