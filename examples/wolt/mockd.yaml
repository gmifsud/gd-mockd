  - name: menu_events
    idField: id
    idStrategy: sequence
  - name: menu_exports
    idField: id
    response:
      timestamps: { format: none }
      errors: *marketplace-errors
      fields: { hide: [id, _venue_id] }

  # Wolt Drive state.
  - name: drive_venues
    idField: id
    seedData:
      - id: "6710d0000000000000000001"
        name: "Wolt's Cafe (Drive)"
        currency: EUR
        location: { coordinates: { lat: 60.1700444, lon: 24.9254858 }, formatted_address: "Pohjoinen Rautatiekatu 21, 00100 Helsinki" }
        # Delivery area: a lat/lon box around the venue (Helsinki centre).
        max_lat_offset: 0.15
        max_lon_offset: 0.30
        base_fee: 590
  - name: shipment_promises
    idField: id
    response:
      timestamps: { format: none }
      errors: *drive-errors
  - name: deliveries
    idField: id
    response:
      timestamps: { format: none }
      errors: *drive-errors
  - name: drive_events
    idField: id
    idStrategy: sequence

# ── Business rules ─────────────────────────────────────────────────────────────
# Expression notes: '"x"' is a string literal, bare names are variables.
# Nested fields are updated with fromPairs(concat(toPairs(obj), [["k", v]])).
x-ts: &ts { type: set, var: ts, value: 'now().UTC().Format("2006-01-02T15:04:05.000Z")' }
x-read-v2: &read-v2 { type: read, resource: orders_v2, id: input.orderId, as: o2 }
x-read-v1: &read-v1 { type: read, resource: orders, id: input.orderId, as: o1 }

customOperations:
  # PUT /orders/{orderId}/accept  {adjusted_pickup_time?}
  - name: AcceptOrder
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'o2.order_status in ["received", "fetched", "acknowledged"]'
        errorMessage: "Order can only be accepted before it is accepted, rejected or delivered"
        errorStatus: 409
      - type: validate
        condition: "o2.delivery.self_delivery != true"
        errorMessage: "Self-delivery orders are accepted via /self-delivery/accept"
        errorStatus: 409
      - type: validate
        condition: 'input.adjusted_pickup_time == nil || date(input.adjusted_pickup_time) - date(o2.pickup_eta) <= duration("25m")'
        errorMessage: "adjusted_pickup_time cannot be more than 25 minutes after the initial pickup estimate"
        errorStatus: 400
      - *ts
      - type: update
        resource: orders_v2
        id: input.orderId
        set: { order_status: '"production"', modified_at: ts, pickup_eta: "input.adjusted_pickup_time ?? o2.pickup_eta" }
      - type: update
        resource: orders
        id: input.orderId
        set: { order_status: '"production"', modified_at: ts, pickup_eta: "input.adjusted_pickup_time ?? o2.pickup_eta" }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"accept"', order_status: '"production"', at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/reject  {reason, code?}
  - name: RejectOrder
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'input.reason != nil && input.reason != ""'
        errorMessage: "reason is required"
        errorStatus: 400
      - type: validate
        condition: 'input.code == nil || input.code in ["GENERIC", "ITEMS_UNAVAILABLE", "VENUE_CLOSING_SOON"]'
        errorMessage: "code must be one of GENERIC, ITEMS_UNAVAILABLE, VENUE_CLOSING_SOON"
        errorStatus: 400
      - type: validate
        condition: 'o2.order_status in ["received", "fetched", "acknowledged"]'
        errorMessage: "Order can only be rejected before it has been accepted"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"rejected"', modified_at: ts } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"rejected"', modified_at: ts } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"reject"', order_status: '"rejected"', at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/self-delivery/accept  {total_delivery_time?}
  - name: AcceptSelfDeliveryOrder
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "o2.delivery.self_delivery == true"
        errorMessage: "Order is not a self-delivery order"
        errorStatus: 409
      - type: validate
        condition: 'o2.order_status in ["received", "fetched", "acknowledged"]'
        errorMessage: "Order can only be accepted before it is accepted, rejected or delivered"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"production"', modified_at: ts } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"production"', modified_at: ts } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"self_delivery_accept"', order_status: '"production"', at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/confirm-preorder
  - name: ConfirmPreorder
    consistency: atomic
    steps:
      - *read-v2
      - *read-v1
      - type: validate
        condition: 'o2.type == "preorder" && o2.pre_order != nil && o2.pre_order.pre_order_status == "waiting"'
        errorMessage: "Only waiting pre-orders can be confirmed"
        errorStatus: 409
      - *ts
      - type: update
        resource: orders_v2
        id: input.orderId
        set: { modified_at: ts, pre_order: 'fromPairs(concat(toPairs(o2.pre_order), [["pre_order_status", "confirmed"]]))' }
      - type: update
        resource: orders
        id: input.orderId
        set: { modified_at: ts, pre_order: 'fromPairs(concat(toPairs(o1.pre_order), [["pre_order_status", "confirmed"]]))' }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"confirm_preorder"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/ready
  - name: MarkOrderReady
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'o2.order_status == "production"'
        errorMessage: "Only accepted orders (status production) can be marked ready"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"ready"', modified_at: ts } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"ready"', modified_at: ts } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"ready"', order_status: '"ready"', at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/delivered
  - name: MarkOrderDelivered
    consistency: atomic
    steps:
      - *read-v2
      - *read-v1
      - type: validate
        condition: 'o2.order_status == "ready"'
        errorMessage: "Only ready orders can be marked delivered"
        errorStatus: 409
      - *ts
      - type: update
        resource: orders_v2
        id: input.orderId
        set: { order_status: '"delivered"', modified_at: ts, delivery: 'o2.delivery.type == "takeaway" ? o2.delivery : fromPairs(concat(toPairs(o2.delivery), [["status", "delivered"]]))' }
      - type: update
        resource: orders
        id: input.orderId
        set: { order_status: '"delivered"', modified_at: ts, delivery: 'o1.delivery.type == "takeaway" ? o1.delivery : fromPairs(concat(toPairs(o1.delivery), [["status", "delivered"]]))' }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"delivered"', order_status: '"delivered"', at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/pickup-completed (self-delivery, after ready)
  - name: MarkPickupCompleted
    consistency: atomic
    steps:
      - *read-v2
      - *read-v1
      - type: validate
        condition: 'o2.delivery.self_delivery == true && o2.order_status == "ready"'
        errorMessage: "Valid only for self-delivery orders that are marked ready"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o2.delivery), [["status", "picked_up"]]))' } }
      - { type: update, resource: orders, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o1.delivery), [["status", "picked_up"]]))' } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"pickup_completed"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/courier-at-customer (self-delivery, after ready)
  - name: MarkCourierAtCustomer
    consistency: atomic
    steps:
      - *read-v2
      - *read-v1
      - type: validate
        condition: 'o2.delivery.self_delivery == true && o2.order_status == "ready"'
        errorMessage: "Valid only for self-delivery orders that are marked ready"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o2.delivery), [["status", "courier_at_delivery_location"]]))' } }
      - { type: update, resource: orders, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o1.delivery), [["status", "courier_at_delivery_location"]]))' } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"courier_at_customer"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/delivery/tracking/location  {location, heading?, is_delivering_this_order?}
  - name: UpdateCourierLocation
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "o2.delivery.self_delivery == true"
        errorMessage: "Courier location is only accepted for self-delivery orders"
        errorStatus: 409
      - type: validate
        condition: 'o2.order_status == "ready"'
        errorMessage: "Location can only be updated after the order has been marked ready"
        errorStatus: 400
      - type: validate
        condition: "input.location != nil"
        errorMessage: "location is required"
        errorStatus: 400
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"courier_location"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/delivery/eta  {eta_minutes}
  - name: UpdateDeliveryEta
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "o2.delivery.self_delivery == true"
        errorMessage: "ETA updates are only accepted for self-delivery orders"
        errorStatus: 409
      - type: validate
        condition: "input.eta_minutes != nil && input.eta_minutes >= 0"
        errorMessage: "eta_minutes is required"
        errorStatus: 400
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"delivery_eta"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/replace-items  {item_changes, item_additions?}
  # Wolt processes replacements asynchronously; the twin records them only.
  - name: ReplaceOrderItems
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "input.item_changes != nil"
        errorMessage: "item_changes is required"
        errorStatus: 400
      - type: validate
        condition: 'o2.order_status == "production"'
        errorMessage: "Items can only be replaced while the order is in production"
        errorStatus: 409
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"replace_items"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/sent-to-pos  {success, time_sent_to_pos}
  - name: MarkOrderSentToPos
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "input.success != nil && input.time_sent_to_pos != nil"
        errorMessage: "success and time_sent_to_pos are required"
        errorStatus: 400
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"sent_to_pos"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # PUT /orders/{orderId}/deposits-returned  {action, items}
  - name: MarkDepositsReturned
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'input.action == "REFUND_USER_CREDITS" && input.items != nil'
        errorMessage: "action (REFUND_USER_CREDITS) and items are required"
        errorStatus: 400
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"deposits_returned"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # POST /orders/{orderId}/refund-items  {reason, item_refunds}
  - name: RefundItems
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'input.reason in ["PRICE_DIFFERENCE", "QUALITY_ISSUES"] && input.item_refunds != nil && len(input.item_refunds) > 0'
        errorMessage: "reason (PRICE_DIFFERENCE|QUALITY_ISSUES) and a non-empty item_refunds are required"
        errorStatus: 400
      - type: validate
        condition: 'not (o2.order_status in ["received", "fetched", "acknowledged", "rejected"])'
        errorMessage: "The order is not yet in a state that allows item refunds"
        errorStatus: 409
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"refund_items"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # POST /orders/{orderId}/refund-basket  {basket_refunds: [exactly one]}
  - name: RefundBasket
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: "input.basket_refunds != nil && len(input.basket_refunds) == 1"
        errorMessage: "Exactly one basket refund per request is allowed"
        errorStatus: 400
      - type: validate
        condition: 'not (o2.order_status in ["received", "fetched", "acknowledged", "rejected"])'
        errorMessage: "The order is not yet in a state that allows refunds"
        errorStatus: 409
      - *ts
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"refund_basket"', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  # ── Wolt-side transitions (no HTTP route; run by sim/wolt_sim.py through
  #    POST /state/operations/{name}/execute, or by `mockd stateful custom run`) ──
  - name: WoltCancelOrder              # consumer / Wolt support cancels, or auto-reject
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'not (o2.order_status in ["delivered", "rejected"])'
        errorMessage: "Order is already final"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"rejected"', modified_at: ts } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"rejected"', modified_at: ts } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"wolt_cancel"', order_status: '"rejected"', at: ts, payload: input }
    response: { id: input.orderId }

  - name: WoltStartPreorderProduction  # confirmed pre-order reaches its preparation window
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - type: validate
        condition: 'o2.type == "preorder" && o2.pre_order.pre_order_status == "confirmed" && o2.order_status in ["received", "fetched", "acknowledged"]'
        errorMessage: "Only confirmed pre-orders awaiting preparation can start production"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"production"', modified_at: ts } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"production"', modified_at: ts } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"wolt_preorder_production"', order_status: '"production"', at: ts, payload: input }
    response: { id: input.orderId }

  - name: WoltCourierUpdate            # Wolt courier progress: courier_at_venue | picked_up | courier_at_delivery_location
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - { type: read, resource: orders, id: input.orderId, as: o1 }
      - type: validate
        condition: 'o2.delivery.type == "homedelivery" && o2.delivery.self_delivery != true && o2.order_status in ["production", "ready"]'
        errorMessage: "Only accepted Wolt-delivered orders have courier updates"
        errorStatus: 409
      - type: validate
        condition: 'input.status in ["courier_at_venue", "picked_up", "courier_at_delivery_location"]'
        errorMessage: "status must be courier_at_venue, picked_up or courier_at_delivery_location"
        errorStatus: 400
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o2.delivery), [["status", input.status]]))' } }
      - { type: update, resource: orders, id: input.orderId, set: { modified_at: ts, delivery: 'fromPairs(concat(toPairs(o1.delivery), [["status", input.status]]))' } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"wolt_courier_" + input.status', order_status: o2.order_status, at: ts, payload: input }
    response: { id: input.orderId }

  - name: WoltDeliverOrder             # Wolt courier completes the drop-off
    consistency: atomic
    steps:
      - { type: read, resource: orders_v2, id: input.orderId, as: o2 }
      - { type: read, resource: orders, id: input.orderId, as: o1 }
      - type: validate
        condition: 'o2.delivery.type == "homedelivery" && o2.delivery.self_delivery != true && o2.order_status in ["production", "ready"]'
        errorMessage: "Only accepted Wolt-delivered orders can be delivered by Wolt"
        errorStatus: 409
      - *ts
      - { type: update, resource: orders_v2, id: input.orderId, set: { order_status: '"delivered"', modified_at: ts, delivery: 'fromPairs(concat(toPairs(o2.delivery), [["status", "delivered"]]))' } }
      - { type: update, resource: orders, id: input.orderId, set: { order_status: '"delivered"', modified_at: ts, delivery: 'fromPairs(concat(toPairs(o1.delivery), [["status", "delivered"]]))' } }
      - type: create
        resource: order_events
        set: { order_id: input.orderId, venue_id: o2.venue.id, action: '"wolt_delivered"', order_status: '"delivered"', at: ts, payload: input }
    response: { id: input.orderId }

  - name: WoltDriveUpdate              # Wolt Drive courier progress for a delivery
    steps:
      - { type: list, resource: deliveries, as: found, filter: { id: input.woltOrderReferenceId } }
      - type: validate
        condition: "len(found) == 1"
        errorMessage: "ORDER_NOT_FOUND"
        errorStatus: 404
      - *ts
      - { type: update, resource: deliveries, id: input.woltOrderReferenceId, set: { status: input.status } }
      - type: create
        resource: drive_events
        set: { kind: '"status"', venue_id: 'found[0].venue_id', ref: input.woltOrderReferenceId, at: ts, payload: input }
    response: { id: input.woltOrderReferenceId }

  # ── Venue API ──
  # PATCH /venues/{venueId}/online  {status: ONLINE|OFFLINE, until?}
  - name: SetVenueOnlineStatus
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
      - type: validate
        condition: 'input.status in ["ONLINE", "OFFLINE"]'
        errorMessage: "status must be ONLINE or OFFLINE"
        errorStatus: 400
      - *ts
      - type: update
        resource: venues
        id: input.venueId
        set:
          status: 'fromPairs(concat(toPairs(v.status), [["is_online", input.status == "ONLINE"]]))'
          _offline_until: 'input.status == "OFFLINE" ? input.until : nil'
      - type: create
        resource: venue_events
        set: { venue_id: input.venueId, external_venue_id: v.external_venue_id, action: '"online_status"', at: ts, payload: input }
    response: { id: input.venueId }

  # PATCH /venues/{venueId}/opening-times  {availability: [...]}
  - name: UpdateVenueOpeningTimes
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
      - type: validate
        condition: "input.availability != nil"
        errorMessage: "availability is required"
        errorStatus: 400
      - *ts
      - { type: update, resource: venues, id: input.venueId, set: { opening_times: input.availability } }
      - type: create
        resource: venue_events
        set: { venue_id: input.venueId, external_venue_id: v.external_venue_id, action: '"opening_times"', at: ts, payload: input }
    response: { id: input.venueId }

  # PUT /venues/{venueId}/special-opening-times  {days_closed?, days_open?, ...}
  - name: SetVenueSpecialOpeningTimes
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
      - *ts
      - { type: update, resource: venues, id: input.venueId, set: { _special_opening_times: input } }
      - type: create
        resource: venue_events
        set: { venue_id: input.venueId, external_venue_id: v.external_venue_id, action: '"special_opening_times"', at: ts, payload: input }
    response: { id: input.venueId }

  # GET /venues/{venueId}/settings
  - name: GetVenueSettings
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
    response: { status: '{"is_open": v.status.is_open}' }

  # GET /venues/{venueId}/delivery-provider
  - name: GetVenueDeliveryProvider
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
    response: { delivery_provider: v._delivery_provider }

  # PATCH /venues/{venueId}/delivery-provider  {delivery_provider: WOLT|SELF_DELIVERY}
  - name: SetVenueDeliveryProvider
    steps:
      - { type: read, resource: venues, id: input.venueId, as: v }
      - type: validate
        condition: 'input.delivery_provider in ["WOLT", "SELF_DELIVERY"]'
        errorMessage: "delivery_provider must be WOLT or SELF_DELIVERY"
        errorStatus: 400
      - { type: update, resource: venues, id: input.venueId, set: { _delivery_provider: input.delivery_provider } }
    response: { id: input.venueId }

  # ── Menu API ──
  # POST /v1/restaurants/{venueId}/menu  (full menu; processed asynchronously by Wolt)
  - name: CreateMenu
    steps:
      - { type: read, resource: menus, id: input.venueId, as: m }
      - type: validate
        condition: "input.categories != nil"
        errorMessage: "categories is required"
        errorStatus: 400
      - type: update
        resource: menus
        id: input.venueId
        set: { menu: 'fromPairs(filter(toPairs(input), {#[0] != "venueId"}))' }
    response: { id: input.venueId }

  # GET /v2/venues/{venueId}/menu -> 202 {request_id, resource_url}
  - name: RequestMenuExport
    steps:
      - { type: read, resource: menus, id: input.venueId, as: m }
      - type: create
        resource: menu_exports
        as: e
        set: { _venue_id: input.venueId, status: '"READY"', error: nil, menu: m.menu }
      - { type: update, resource: menu_exports, id: e.id, set: { request_id: e.id } }
    response:
      request_id: e.id
      # Change the host here if clients reach the twin under another name.
      resource_url: '"http://localhost:4280/_mock/s3/menu-exports/" + e.id'

  # PATCH /venues/{venueId}/items  {data: [{external_id|gtin|sku, price?, enabled?, in_stock?, ...}]}
  - name: UpdateMenuItems
    steps:
      - { type: read, resource: menus, id: input.venueId, as: m }
      - type: validate
        condition: "input.data != nil && len(input.data) > 0"
        errorMessage: "data must be a non-empty array"
        errorStatus: 400
      - type: validate
        condition: "all(input.data, {(#.external_id != nil ? 1 : 0) + (#.gtin != nil ? 1 : 0) + (#.sku != nil ? 1 : 0) == 1})"
        errorMessage: "Each item must be identified by exactly one of external_id, gtin or sku"
        errorStatus: 400
      - *ts
      - type: create
        resource: menu_events
        set: { venue_id: input.venueId, action: '"items"', at: ts, payload: input }
    response: { id: input.venueId }

  # PATCH /venues/{venueId}/items/inventory  {data: [{external_id|gtin|sku, inventory}]}
  - name: UpdateMenuInventory
    steps:
      - { type: read, resource: menus, id: input.venueId, as: m }
      - type: validate
        condition: "input.data != nil && len(input.data) > 0"
        errorMessage: "data must be a non-empty array"
        errorStatus: 400
      - type: validate
        condition: "all(input.data, {(#.external_id != nil ? 1 : 0) + (#.gtin != nil ? 1 : 0) + (#.sku != nil ? 1 : 0) == 1})"
        errorMessage: "Each item must be identified by exactly one of external_id, gtin or sku"
        errorStatus: 400
      - type: validate
        condition: "all(input.data, {#.inventory != nil})"
        errorMessage: "inventory is required (null is not accepted)"
        errorStatus: 400
      - *ts
      - type: create
        resource: menu_events
        set: { venue_id: input.venueId, action: '"inventory"', at: ts, payload: input }
    response: { id: input.venueId }

  # PATCH /venues/{venueId}/options/values  {data: [{external_id, price?, enabled?, ...}]}
  - name: UpdateMenuOptions
    steps:
      - { type: read, resource: menus, id: input.venueId, as: m }
      - type: validate
        condition: "input.data != nil && len(input.data) > 0 && all(input.data, {#.external_id != nil})"
        errorMessage: "data must be a non-empty array of option values with external_id"
        errorStatus: 400
      - *ts
      - type: create
        resource: menu_events
        set: { venue_id: input.venueId, action: '"options"', at: ts, payload: input }
    response: { id: input.venueId }

  # ── Wolt Drive (venueful flow) ──
  # POST /v1/venues/{venueId}/shipment-promises
  - name: CreateShipmentPromise
    steps:
      - { type: list, resource: drive_venues, as: venues, filter: { id: input.venueId } }
      - type: validate
        condition: "len(venues) == 1"
        errorMessage: "VENUE_NOT_FOUND"
        errorStatus: 404
      - { type: set, var: v, value: "venues[0]" }
      - type: validate
        condition: "input.lat == nil || input.lon == nil || (abs(input.lat - v.location.coordinates.lat) <= v.max_lat_offset && abs(input.lon - v.location.coordinates.lon) <= v.max_lon_offset)"
        errorMessage: "DROPOFF_OUTSIDE_OF_DELIVERY_AREA"
        errorStatus: 400
      - type: validate
        condition: "input.scheduled_dropoff_time == nil || date(input.scheduled_dropoff_time) > now()"
        errorMessage: "INVALID_SCHEDULED_DROPOFF_TIME"
        errorStatus: 400
      - type: validate
        condition: "input.cash == nil"
        errorMessage: "CASH_ON_DELIVERY_DISABLED"
        errorStatus: 400
      - { type: set, var: prep, value: "input.min_preparation_time_minutes ?? 0" }
      - *ts
      - type: create
        resource: shipment_promises
        as: p
        set:
          created_at: ts
          valid_until: 'now().Add(duration("10m")).UTC().Format("2006-01-02T15:04:05.000Z")'
          pickup: '{"venue_id": input.venueId, "location": v.location, "options": {"min_preparation_time_minutes": prep}, "eta_minutes": prep + 5}'
          dropoff: '{"location": {"coordinates": {"lat": input.lat, "lon": input.lon}, "formatted_address": join([input.street ?? "", input.post_code ?? "", input.city ?? ""], " ")}, "options": {"scheduled_time": input.scheduled_dropoff_time}, "eta_minutes": prep + 25}'
          price: '{"amount": v.base_fee, "currency": v.currency}'
          time_estimate_minutes: "prep + 25"
          # Wolt: binding only when the location is precise enough (coordinates given).
          is_binding: "input.lat != nil && input.lon != nil"
          parcels: "input.parcels ?? []"
      - type: create
        resource: drive_events
        set: { kind: '"shipment_promise"', venue_id: input.venueId, ref: p.id, at: ts, payload: input }
    response:
      id: p.id
      created_at: p.created_at
      valid_until: p.valid_until
      pickup: p.pickup
      dropoff: p.dropoff
      price: p.price
      time_estimate_minutes: p.time_estimate_minutes
      is_binding: p.is_binding
      parcels: p.parcels

  # POST /v1/venues/{venueId}/deliveries
  - name: CreateDelivery
    steps:
      - type: validate
        condition: "input.shipment_promise_id != nil && input.recipient != nil && input.parcels != nil && input.dropoff != nil"
        errorMessage: "INVALID_PAYLOAD"
        errorStatus: 400
      - { type: list, resource: shipment_promises, as: promises, filter: { id: input.shipment_promise_id } }
      - type: validate
        condition: 'len(promises) == 1 && promises[0].pickup.venue_id == input.venueId && date(promises[0].valid_until) > now()'
        errorMessage: "SHIPMENT_PROMISE_NOT_FOUND"
        errorStatus: 400
      - { type: set, var: p, value: "promises[0]" }
      - type: validate
        condition: "p.is_binding"
        errorMessage: "INVALID_PAYLOAD"
        errorStatus: 400
      - { type: list, resource: deliveries, as: dups, filter: { merchant_order_reference_id: input.merchant_order_reference_id } }
      - type: validate
        condition: "input.merchant_order_reference_id == nil || len(dups) == 0"
        errorMessage: "DUPLICATE_ORDER"
        errorStatus: 400
      - *ts
      - type: create
        resource: deliveries
        as: d
        set:
          venue_id: input.venueId
          status: '"INFO_RECEIVED"'
          pickup: '{"location": p.pickup.location, "comment": input.pickup?.comment, "options": {"min_preparation_time_minutes": p.pickup.options.min_preparation_time_minutes}, "eta": now().Add(duration(string(p.pickup.eta_minutes) + "m")).UTC().Format("2006-01-02T15:04:05.000Z")}'
          dropoff: '{"location": p.dropoff.location, "comment": input.dropoff.comment, "options": input.dropoff.options, "eta": now().Add(duration(string(p.time_estimate_minutes) + "m")).UTC().Format("2006-01-02T15:04:05.000Z")}'
          price: p.price
          recipient: input.recipient
          parcels: input.parcels
          customer_support: input.customer_support
          merchant_order_reference_id: input.merchant_order_reference_id
          tips: "input.tips ?? []"
          order_number: input.order_number
          shipment_promise_id: input.shipment_promise_id
          handshake_delivery: input.handshake_delivery
      - type: update
        resource: deliveries
        id: d.id
        as: d
        set:
          wolt_order_reference_id: d.id
          tracking: '{"id": d.id, "url": "http://localhost:4280/_mock/tracking/" + d.id}'
      - type: create
        resource: drive_events
        set: { kind: '"delivery_created"', venue_id: input.venueId, ref: d.id, at: ts, payload: input }
    response:
      id: d.id
      status: d.status
      tracking: d.tracking
      pickup: d.pickup
      dropoff: d.dropoff
      price: d.price
      recipient: d.recipient
      parcels: d.parcels
      customer_support: d.customer_support
      wolt_order_reference_id: d.wolt_order_reference_id
      merchant_order_reference_id: d.merchant_order_reference_id
      tips: d.tips
      order_number: d.order_number

  # PATCH /order/{woltOrderReferenceId}/status/cancel
  - name: CancelDelivery
    steps:
      - { type: list, resource: deliveries, as: found, filter: { id: input.woltOrderReferenceId } }
      - type: validate
        condition: "len(found) == 1"
        errorMessage: "ORDER_NOT_FOUND"
        errorStatus: 404
      - type: validate
        condition: 'found[0].status == "INFO_RECEIVED"'
        errorMessage: "CANCELLATION_NOT_ALLOWED"
        errorStatus: 409
      - *ts
      - { type: update, resource: deliveries, id: input.woltOrderReferenceId, set: { status: '"CANCELLED"' } }
      - type: create
        resource: drive_events
        set: { kind: '"delivery_cancelled"', venue_id: 'found[0].venue_id', ref: input.woltOrderReferenceId, at: ts, payload: input }
    response: { id: input.woltOrderReferenceId }

